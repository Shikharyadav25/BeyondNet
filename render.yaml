# Review Render's price before creating this service. This is a paid plan.
services:
  - type: web
    name: beyondnet-bank
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_cloud_bank.py
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: KARO_DATA_DIR
        value: /var/data/beyondnet
    disk:
      name: beyondnet-bank-data
      mountPath: /var/data
      sizeGB: 1
