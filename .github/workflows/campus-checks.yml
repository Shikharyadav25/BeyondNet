name: Campus and payment checks
on:
  push:
    branches: [feat/campus-mesh]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: beyondnet
          POSTGRES_USER: beyondnet
          POSTGRES_PASSWORD: local-ci-only-password
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U beyondnet -d beyondnet"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BEYONDNET_DB_URL: jdbc:postgresql://127.0.0.1:5433/beyondnet
      BEYONDNET_DB_USER: beyondnet
      BEYONDNET_DB_PASSWORD: local-ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q tests/test_java_bank.py
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
