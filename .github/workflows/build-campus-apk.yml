name: Build Campus APK
on:
  push:
    branches: [feat/campus-mesh]
    paths: [mobile/**, .github/workflows/build-campus-apk.yml]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - name: Flutter tests with failure annotations
        working-directory: mobile
        run: |
          set +e
          flutter test --machine > "$RUNNER_TEMP/flutter-tests.json"
          result=$?
          set -e
          python3 ../scripts/report-flutter-tests.py "$RUNNER_TEMP/flutter-tests.json"
          exit "$result"
      - run: flutter build apk --release
        working-directory: mobile
      - name: Store versioned installer
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk installers/BeyondNet-Android-1.5.1.apk
          cd installers
          sed -i '/  BeyondNet-Android-1.5.1.apk$/d' SHA256SUMS.txt
          sha256sum BeyondNet-Android-1.5.1.apk >> SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BeyondNet-Android-1.5.1
          path: installers/BeyondNet-Android-1.5.1.apk
      - name: Commit installer to campus branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installers/BeyondNet-Android-1.5.1.apk installers/SHA256SUMS.txt
          git commit -m 'build: add Campus Android 1.5.1 installer [skip ci]'
          git push origin HEAD:feat/campus-mesh
