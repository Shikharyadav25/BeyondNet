name: Build Campus APK
on:
  push:
    branches: [feat/campus-mesh]
    paths: [mobile/**, scripts/report-flutter-tests.py, .github/workflows/build-campus-apk.yml]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: beyondnet
          POSTGRES_USER: beyondnet
          POSTGRES_PASSWORD: local-ci-only-password
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U beyondnet -d beyondnet"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BEYONDNET_DB_URL: jdbc:postgresql://127.0.0.1:5433/beyondnet
      BEYONDNET_DB_USER: beyondnet
      BEYONDNET_DB_PASSWORD: local-ci-only-password
      BEYONDNET_TEST_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: mvn -B -f backend/pom.xml -DskipTests package
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - name: Flutter tests with failure annotations
        working-directory: mobile
        run: |
          set +e
          flutter test --machine > "$RUNNER_TEMP/flutter-tests.json"
          result=$?
          set -e
          python3 ../scripts/report-flutter-tests.py "$RUNNER_TEMP/flutter-tests.json"
          exit "$result"
      - run: flutter build apk --release
        working-directory: mobile
      - name: Store versioned installer
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk installers/BeyondNet-Android-1.5.1.apk
          cd installers
          sed -i '/  BeyondNet-Android-1.5.1.apk$/d' SHA256SUMS.txt
          sha256sum BeyondNet-Android-1.5.1.apk >> SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BeyondNet-Android-1.5.1
          path: installers/BeyondNet-Android-1.5.1.apk
      - name: Commit installer to campus branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installers/BeyondNet-Android-1.5.1.apk installers/SHA256SUMS.txt
          git commit -m 'build: add Campus Android 1.5.1 installer [skip ci]'
          git push origin HEAD:feat/campus-mesh
